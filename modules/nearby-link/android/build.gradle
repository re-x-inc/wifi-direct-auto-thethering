plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nearbylink'
version = '0.1.0'

android {
  namespace "expo.modules.nearbylink"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
