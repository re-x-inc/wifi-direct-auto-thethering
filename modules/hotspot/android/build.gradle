plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hotspot'
version = '0.1.0'

android {
  namespace "expo.modules.hotspot"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Direct 上の制御バス(BusEngine)。純 Java の ZeroMQ(MPL-2.0)。jar 約 540KB + jnacl 20KB
  implementation 'org.zeromq:jeromq:0.6.0'
}
dependencies {
  testImplementation 'junit:junit:4.13.2'
}
