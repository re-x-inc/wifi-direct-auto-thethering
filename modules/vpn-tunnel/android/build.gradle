plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vpntunnel'
version = '0.1.0'

android {
  namespace "expo.modules.vpntunnel"
  ndkVersion "27.1.12297006"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    ndk { abiFilters 'arm64-v8a' }
  }
  externalNativeBuild {
    ndkBuild { path "src/main/jni/Android.mk" }
  }
}
